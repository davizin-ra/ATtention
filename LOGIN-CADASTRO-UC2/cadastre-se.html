<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastre-se.css">
    <title>Attention | Cadastre-se</title>
</head>
<body>
    <!-- INICIO - HEADER (MENU DO SITE) -->
        <header id="header">
            <div class="logo">
                <img src="assets/images/img-logo.png" alt="img-logo">
                <a href="">Attention</a>
            </div>

            <nav class="nav-menu">
                <a href="#">Inicio</a>
                <a href="#">Sobre nós</a>

                <a class="btn-login" href="#"><button>Fazer Login</button></a>
            </nav>
        </header>
        <!-- FIM - HEADER (MENU DO SITE) -->


        <!-- INICIO - MAIN (CADASTRAR-SE) -->

        <main class="opcao-cadastro-container" id="opcao-cadastro-container">
            <section class="div-esquerda">
                
                <div class="caixinha-geral">
                    <h1>Crie sua conta</h1>

                    <div class="cards">
                        <h2>Sou aluno</h2>
                        <p>Quero encontrar um psicólogo e ter acompanhado de forma acessível.</p>

                        <div class="btn-cadastrar">
                            <a href="#"><button>Cadastrar como responsável</button></a>
                        </div>
                    </div>

                    <div class="cards">
                        <h2>Sou psicólogo</h2>
                        <p>Quero oferecer atendimento psicológico e tornar meu trabalho mais acessível.</p>

                        <div class="btn-cadastrar">
                            <a href="#"><button>Cadastrar como psicólogo</button></a>
                        </div>
                    </div>

                    <div class="div-voltar">
                        <a id="div-btn" href="login.html"><button>Voltar</button></a>
                    </div>
                </div>
            </section>

            <section class="div-direita">
                <img src="assets/images/mulher-crianca.png" alt="mulher-crianca">
            </section>
        </main>

        <!-- FIM - MAIN (CADASTRAR-SE) -->
</body>
</html>
