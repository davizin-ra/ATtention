<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Assistente virtual da ATtention para dúvidas sobre TEA e indicação de profissionais."
    />
    <title>Assistente ATtention</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/IA.css" />
  </head>
  <body>
    <main class="pagina-ia">
      <section class="chat">
        <div class="area-mensagens">
          <div class="linha-mensagem linha-mensagem-ia">
            <div class="avatar-ia"></div>
            <p class="balao balao-ia">
              Olá! Sou o pecinha, vou te ajudar nessa jornada
            </p>
          </div>
        </div>
        <form class="formulario-chat">
          <input
            id="campo-mensagem"
            class="campo-mensagem"
            type="text"
            placeholder="Preciso de apoio para inclusão escolar"
            autocomplete="off"
          />
          <button class="botao-enviar" type="submit">Enviar</button>
        </form>
      </section>
    </main>
    <script src="../scripts/IA-config.js"></script>
    <script src="../scripts/IA.js"></script>
  </body>
</html>
