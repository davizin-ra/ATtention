<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATtention</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/Search.css" />
  </head>

  <body>
    <main>
      <section class="top-section" aria-labelledby="titulo-busca">
        <div class="search-box">
          <div class="top-texto">
            <span>Profissionais ATtention</span>
            <h1 id="titulo-busca">Encontre o apoio que você procura</h1>
          </div>

          <div class="filters">
            <div class="selects">
              <label>
                <span>Serviço</span>
                <select id="select-servico">
                  <option value="">Todos os serviços</option>
                </select>
              </label>
              <label>
                <span>Localização</span>
                <select id="select-loc">
                  <option value="">Todas as regiões</option>
                </select>
              </label>
              <label>
                <span>Organizar por</span>
                <select id="ordenacao">
                  <option value="avaliacao">Melhor avaliação</option>
                  <option value="anosAt">Mais experiência</option>
                  <option value="atendimentos">Mais atendimentos</option>
                  <option value="nomeAz">Nome (A-Z)</option>
                </select>
              </label>
            </div>

            <div class="input-search">
              <input
                id="campo-busca"
                type="search"
                placeholder="Pesquisar por nome, serviço ou região"
              />
              <button class="btn-1" type="button">Pesquisar</button>
            </div>
          </div>
        </div>
      </section>
      <section class="cards-section">
        <div class="text-pesquisa">
          <p>Profissionais disponíveis</p>
          <strong id="qtd-pesquisa"></strong>
        </div>

        <div id="cards-container"></div>

        <p id="prof-vazio">
          Nenhum profissional encontrado. Tente ajustar os filtros.
        </p>
      </section>
    </main>

    <script src="../scripts/Search.js"></script>
  </body>
</html>
