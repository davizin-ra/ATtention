<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATtention</title>
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/ViewAT.css" />
  </head>
  <body>
    <main>
      <section class="user-section">
        <div class="profile">
          <div class="banner" id="banner"></div>
          <div class="info-principal">
            <img id="img" src="../../assets/images/Boneco.png" alt="" />
            <h1 id="nome"></h1>
            <p id="area"></p>

            <div class="if2">
              <p id="regiao"></p>
            </div>

            <div class="btns">
              <button class="btn-1">Entrar em contato</button>
              <button class="btn-2">Salvar perfil</button>
            </div>
          </div>
        </div>
        <div class="stats">
          <div>
            <h3 id="atendimentos"></h3>
            <p>Atentimentos</p>
          </div>
          <div>
            <h3 id="avaliacao"></h3>
            <p>Avaliação</p>
          </div>
          <div>
            <h3 id="familias"></h3>
            <p>Famílias</p>
          </div>
          <div>
            <h3 id="anosAT"></h3>
            <p>Anos de AT</p>
          </div>
        </div>
      </section>
      <section class="info-section">
        <div>
          <h1>Sobre</h1>
          <p id="sobre"></p>
        </div>

        <div>
          <h1>Formação</h1>
          <div id="formacao-container"></div>
        </div>
        <div>
          <h1>Capacitações</h1>
          <div id="capacitacoes-container"></div>
        </div>
        <div>
          <h1>Modalidades de atuação</h1>
          <div class="ltt" id="modalidades"></div>
        </div>
        <div>
          <h1>Áreas de atuação</h1>
          <div class="ltt" id="atuacao"></div>
        </div>
        <div>
          <div class="disp">
            <p data = "Seg">Seg</p>
            <p data = "Ter">Ter</p>
            <p data = "Qua">Qua</p>
            <p data =" Qui">Qui</p>
            <p data = "Sex">Sex</p>
            <p data = "Sab">Sab</p>
            <p data = "Dom">Dom</p>
          </div>
        </div>
      </section>
    </main>

    <script src="../scripts/ViewAT.js"></script>
  </body>
</html>
