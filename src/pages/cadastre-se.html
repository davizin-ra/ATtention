<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/cadastre-se.css" />
    <title>Cadastre-se | Attention</title>
  </head>
  <body>
    <header class="header" data-header>
      <nav class="header-container" aria-label="Menu principal">
        <a
          class="header-brand"
          href="../../index.html"
          aria-label="ATtention — página inicial"
        >
          <img
            class="header-logo"
            src="../../assets/images/LandingPage/logo-transparente.png"
            alt="Logo do ATtention"
          />
          <span>ATtention</span>
        </a>

        <button
          class="header-menu-toggle"
          data-site-menu-toggle
          type="button"
          aria-label="Abrir menu"
          aria-expanded="false"
          aria-controls="header-menu"
        >
          <span></span>
        </button>

        <ul class="header-menu" id="header-menu" data-site-menu>
          <li><a class="header-link" href="../../index.html">Início</a></li>
          <li><a class="header-link" href="./SobreNos.html">Sobre Nós</a></li>
          <li>
            <a class="header-link" href="../../index.html#conhecimento"
              >Conhecimento</a
            >
          </li>
          <li>
            <a href="./login.html" class="header-login">Fazer Login</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="opcao-cadastro-container" id="opcao-cadastro-container">
      <section class="div-esquerda">
        <div class="caixinha-geral">
          <h2>Crie sua conta</h2>

          <div class="cards">
            <h3>Sou o Responsável</h3>
            <p>
              Quero encontrar um psicólogo e ter acompanhado de forma acessível.
            </p>

            <div class="btn-cadastrar">
              <a href="cadastro-responsavel.html"
                ><button>Cadastrar como responsável</button></a
              >
            </div>
          </div>

          <div class="cards">
            <h3>Sou o psicólogo</h3>
            <p>
              Quero oferecer atendimento psicológico e tornar meu trabalho mais
              acessível.
            </p>

            <div class="btn-cadastrar">
              <a href="cadastro-psicologo.html"
                ><button>Cadastrar como psicólogo</button></a
              >
            </div>
          </div>

          <div class="div-voltar">
            <a id="div-btn" href="login.html"><button>Voltar</button></a>
          </div>
        </div>
      </section>

      <section class="div-direita">
        <img
          src="../../assets/images/fernando/mulher2.jpg"
          alt="mulher-crianca"
        />
      </section>
    </main>

    <script src="../scripts/main.js"></script>
    <script
      src="https://cdn.userway.org/widget.js"
      data-account="y2KIm9pPv2"
    ></script>
