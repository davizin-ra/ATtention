<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/pages/cadastro-psicologo.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="../../assets/icone.png"
    />
    <title>ATtention</title>
  </head>

  <body>
    <header class="header" data-header>
      <nav class="header-container" aria-label="Menu principal">
        <a
          class="header-brand"
          href="../../index.html"
          aria-label="ATtention — página inicial"
        >
          <img
            class="header-logo"
            src="../../assets/images/LandingPage/logo-transparente.png"
            alt="Logo do ATtention"
          />
          <span>ATtention</span>
        </a>

        <button
          class="header-menu-toggle"
          data-site-menu-toggle
          type="button"
          aria-label="Abrir menu"
          aria-expanded="false"
          aria-controls="header-menu"
        >
          <span></span>
        </button>

        <ul class="header-menu" id="header-menu" data-site-menu>
          <li><a class="header-link" href="../../index.html">Início</a></li>
          <li><a class="header-link" href="./SobreNos.html">Sobre Nós</a></li>
          <li>
            <a class="header-link" href="../../index.html#conhecimento"
              >Conhecimento</a
            >
          </li>
          <li>
            <a href="./login.html" class="header-login">Fazer Login</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="container" id="container">
      <section id="section-esquerda">
        <img src="../../assets/images/fernando/mulher4.jpg" alt="professora" />
      </section>

      <section id="section-direita">
        <div class="div-form">
          <div class="textos">
            <h2>Cadastro de <span>Psicólogo</span></h2>
            <p>
              Crie seu perfil profissional para oferecer atendimento psicólogo
              acessível.
            </p>
          </div>

          <!-- DADOS DOS RESPONSÁVEIS -->

          <form class="formulario">
            <h3 class="titulo-h3b">Dados Pessoais do Psicólogo</h3>

            <div class="campo">
              <label>
                Nome completo <br />
                <input
                  type="text"
                  name="text"
                  placeholder="Seu nome completo"
                  required
                />
              </label>

              <label>
                Nome social (opcional) <br />
                <input
                  type="text"
                  name="text"
                  placeholder="Como prefere ser chamado"
                  required
                />
              </label>
            </div>

            <div class="campo">
              <label>
                Data de nascimento <br />
                <input type="date" name="Data" required />
              </label>

              <label>
                Telefone <br />
                <input
                  type="tel"
                  maxlength="11"
                  name="telefone"
                  placeholder="(00) 00000-0000"
                  required
                />
              </label>
            </div>

            <div class="campo">
              <label>
                CPF <br />
                <input
                  type="text"
                  name="documento"
                  maxlength="11"
                  placeholder="Digite o número do CPF"
                  required
                />
              </label>

              <label>
                Código CRP <br />
                <input
                  type="text"
                  name="CRP"
                  maxlength="7"
                  placeholder="Informe seu o código do seu CRP"
                  required
                />
              </label>
            </div>

            <div class="campo">
              <label for="cep"
                >CEP: <br />
                <input type="text" id="cep" placeholder="Digite seu CEP" />
              </label>

              <label for="rua"
                >Rua: <br />
                <input type="text" id="rua" placeholder="Rua" />
              </label>
            </div>

            <div class="campo">
              <label for="bairro"
                >Bairro: <br />
                <input type="text" id="bairro" placeholder="Bairro" />
              </label>

              <label for="cidade"
                >Cidade: <br />
                <input type="text" id="cidade" placeholder="Cidade" />
              </label>
            </div>

            <div class="campo">
              <label for="estado"
                >Estado: <br />
                <input type="text" id="estado" placeholder="Estado" />
              </label>

              <label for="estado"
                >E-mail: <br />
                <input type="email" placeholder=" Digite seu e-mail" />
              </label>
            </div>

            <div class="campo">
              <label>
                Senha<br />
                <input
                  type="password"
                  name="senha"
                  placeholder="Digite sua senha"
                  required
                />
              </label>

              <label>
                Confirmar a senha <br />
                <input
                  type="password"
                  name="senha"
                  placeholder="Confirme sua senha"
                  required
                />
              </label>
            </div>

            <h3 class="titulo-h3a">Perfil profissional</h3>

            <div class="campo2">
              <label for="tea"
                >Título profissional<br />
                <input
                  type="text"
                  name="titulo-profissinal"
                  placeholder="EX: Psicólogo clínico"
                  required
                />
              </label>
            </div>

            <div class="campo3">
              <label
                >Sobre você <br />
                <textarea
                  name="area-acompanhmento"
                  placeholder="Conte sua experiência e sua forma de trabalho"
                  required
                ></textarea>
              </label>
            </div>

            <div class="campo2">
              <label for="tea"
                >Formação academica<br />
                <input
                  type="text"
                  name="titulo-profissinal"
                  placeholder="EX: Psicologia - Universidade ..."
                  required
                />
              </label>
            </div>

            <div class="campo2">
              <label for="tea"
                >Especialização / abordagem<br />
                <input
                  type="text"
                  name="titulo-profissinal"
                  placeholder="EX: TCC, Psicologia clínica ..."
                  required
                />
              </label>
            </div>

            <a href="login.html"
              ><button class="btn-finalizar">
                Finalizar Cadastro do responsável
              </button></a
            >
          </form>
          <!-- FIM - DADOS DOS PSICÓLOGOS -->

          <div class="container-btn">
            <a href="cadastre-se.html"><button>Voltar</button></a>
          </div>
        </div>
      </section>
    </main>

    <script src="../scripts/main.js"></script>
    <script
      src="https://cdn.userway.org/widget.js"
      data-account="y2KIm9pPv2"
    ></script>
    <script src="../scripts/cadastro-responsavel.js"></script>
  </body>
</html>
