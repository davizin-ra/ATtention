<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/pages/cadastro-responsavel.css">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/icone.png" />
    <title>ATtention</title>
</head>

<body>

    <!-- INICIO - MAIN (CADASTRAR-SE) -->
    <main class="container" id="container">
        <section id="section-esquerda">
            <img src="../../assets/images/fernando/mulher3.jpg" alt="professora">
        </section>

        <section id="section-direita">

            <div class="div-form">
                <div class="textos">
                    <h2>Cadastro de <span>Responsável</span></h2>
                    <p>Crie seu perfil para ter o melhores Psicólogos disponíveis para você.</p>
                </div>

                <div class="area-dados-responsavel">

                    <!-- DADOS DOS RESPONSÁVEIS -->
                    <h3 class="titulo-h3">Dados Pessoais do responsável</h3>

                    <form class="formulario" action="cadastro-responsavel2.html" method="get">

                        <div class="campo">
                            <label>
                                Nome completo <br>
                                <input type="text" name="text" placeholder="Seu nome completo" required>
                            </label>

                            <label>
                                Nome social (opcional) <br>
                                <input type="text" name="text" placeholder="Como prefere ser chamado" required>
                            </label>
                        </div>

                        <div class="campo">
                            <label>
                                Data de nascimento <br>
                                <input type="date" name="Data" required>
                            </label>

                            <label>
                                Telefone <br>
                                <input type="tel" maxlength="11" name="telefone" placeholder="(00) 00000-0000" required>
                            </label>
                        </div>

                        <div class="campo">
                            <label>
                                CPF <br>
                                <input type="text" name="documento" maxlength="11" placeholder="Digite o número do CPF" required>
                            </label>

                            <label>
                                Grau de parentesco <br>
                                <input type="text" name="grau-parentesco" placeholder="Pai, Mãe, Tia, Tio ..." required>
                            </label>
                        </div>

                        <div class="campo">
                            <label for="cep">CEP: <br>
                                <input type="text" id="cep" placeholder="Digite seu CEP">
                            </label>
                            
                            <label for="rua">Rua: <br>
                                <input type="text" id="rua" placeholder="Rua">
                            </label>
                        </div>

                        <div class="campo">
                            <label for="bairro">Bairro: <br>
                                <input type="text" id="bairro" placeholder="Bairro">
                            </label>

                            <label for="cidade">Cidade: <br>
                                <input type="text" id="cidade" placeholder="Cidade">
                            </label>
                        </div>

                        <div class="campo">
                            <label for="estado">Estado: <br>
                                <input type="text" id="estado" placeholder="Estado">
                            </label>
                        </div>

                    <!-- DADOS DOS ALUNOS -->
                    <h3 class="titulo-h3">Dados Pessoais da criança</h3>

                        <div class="campo">
                            <label>
                                Nome completo <br>
                                <input type="text" name="text" placeholder="Seu nome completo" required>
                            </label>

                            <label>
                                Nome social (opcional) <br>
                                <input type="text" name="text" placeholder="Como prefere ser chamado" required>
                            </label>
                        </div>

                        <div class="campo">
                            <label>
                                Data de nascimento <br>
                                <input type="date" name="Data" id="date"  required>
                            </label>

                            <label>
                                CPF <br>
                                <input type="text" name="documento" maxlength="11" placeholder="Digite o número do CPF" required>
                            </label>
                        </div>

                        <div class="container-btn">
                            <a id="btn-voltar" href="cadastre-se.html">Voltar</a>

                            <button type="submit">Seguinte</button>
                        </div>

                    </form>
                    <!-- FIM - DADOS DOS ALUNO -->
                </div>
            </div>
        </section>
    </main>

    <script src="../scripts/cadastro-responsavel.js"></script>
</body>

</html>
