<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css" type="text/css">
    <title>Login | Attention</title>
</head>
<body>

    <!-- INICIO - HEADER (MENU DO SITE) -->
        <header id="header">
            <div class="logo">
                <img src="assets/images/img-logo.png" alt="img-logo">
                <a href="#">Attention</a>
            </div>

            <nav class="nav-menu">
                <a href="#">Inicio</a>
                <a href="#">Sobre nós</a>

                <a class="btn-login" href="#"><button>Fazer Login</button></a>
            </nav>
        </header>
        <!-- FIM - HEADER (MENU DO SITE) -->

        <!-- COMEÇO DA MINHA SESSÃO -->

        <main class="login-container" id="login-container">

            <section class="login-form responsavel-form">

                <span class="paragrafo">Área do responsável</span>
                <h2 id="titulo-aluno">Entrar como responsável</h2>
                <form id="form-responsavel">
                    <label class="label">
                        Email
                        <input class="input" type="email" placeholder="Seu e-mail" required>
                    </label>

                    <label class="label">
                        Senha
                        <input class="input" type="password" placeholder="Sua senha" required>
                    </label>

                    <a href="esqueceu-senha.html" class="esqueceu-senha">Esqueceu a senha?</a>

                    <label class="lembrar-dados">
                        <input type="checkbox">
                        <span>Lembrar meus dados</span>
                    </label>

                    <button class="btn-entrar" type="submit">Entrar</button>

                    <div class="cadastrar-link">
                        <p>Ainda não tem uma conta?</p>
                        <a href="cadastre-se.html">Cadastre-se</a>   
                    </div>
                </form>
            </section>

            <section class="login-form psicologo-form" aria-labelledby="titulo-psicologo">
                <span class="paragrafo">Área profissional</span>
                <h2 id="titulo-psicologo">Entrar como psicólogo</h2>
                <form id="form-psicologo">
                    <label class="label">
                        Email
                        <input class="input" type="email" placeholder="Seu e-mail" required>
                    </label>

                    <label class="label">
                        Senha
                        <input class="input" type="password" placeholder="Sua senha" required>
                    </label>

                    <a href="esqueceu-senha.html" class="esqueceu-senha">Esqueceu a senha?</a>

                    <label class="lembrar-dados">
                        <input type="checkbox">
                        <span>Lembrar meus dados</span>
                    </label>

                    <button class="btn-entrar" type="submit">Entrar</button>

                    <div class="cadastrar-link">
                        <span></span>
                        <p>Ainda não tem uma conta?</p>
                        <a href="cadastre-se.html">Cadastre-se</a>
                        <span></span>
                    </div>
                </form>
            </section>

            <aside class="painel" id="painel">
                <img src="assets/images/mulher-crianca.png" alt="mulher com a criança">

                <button class="alternar">
                    <span class="seta">→</span>
                    <span class="texto-alternar">Fazer login como psicólogo</span>
                </button>
            </aside>
    </main>

    <!-- FIM DA MINHA SESSÃO -->

    <script src="js/login.js"></script>
</body>
</html>
