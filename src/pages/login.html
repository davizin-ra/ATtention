<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../../src/styles/pages/login.css" type="text/css">
    <link rel="icon" type="image/png" sizes="96x96" href="../../assets/icone.png" />
    <title>ATtention</title>
</head>
<body>

        <!-- COMEÇO DA MINHA SESSÃO -->

        <main class="login-container" id="login-container">

            <button class="alternar">
                <span class="seta">→</span>
                <span class="texto-alternar">Fazer login como psicólogo</span>
            </button>

            <section class="login-form responsavel-form">

                <div class="div-form">
                    
                    <h2 id="titulo-aluno">Entrar como responsável</h2>

                    <form id="form-responsavel">
                        <label class="label">
                            Email
                            <input class="input" type="email" placeholder="Seu e-mail" required>
                        </label>

                        <label class="label">
                            Senha
                            <input class="input" type="password" placeholder="Sua senha" required>
                        </label>

                        <a href="esqueceu-senha.html" class="esqueceu-senha">Esqueceu a senha?</a>

                        <label class="lembrar-dados">
                            <input type="checkbox">
                            <span>Lembrar meus dados</span>
                        </label>

                        <button class="btn-entrar" type="submit">Entrar</button>

                        <div class="cadastrar-link">
                            <p>Ainda não tem uma conta?</p>
                            <a href="cadastre-se.html">Cadastre-se</a>   
                        </div>
                    </form>
                </div>
            </section>

            <section class="login-form psicologo-form">

                <div class="div-form">
                    
                    <h2 id="titulo-psicologo">Entrar como psicólogo</h2>
                    <form id="form-psicologo">
                        <label class="label">
                            Email
                            <input class="input" type="email" placeholder="Seu e-mail" required>
                        </label>

                        <label class="label">
                            Senha
                            <input class="input" type="password" placeholder="Sua senha" required>
                        </label>

                        <a href="esqueceu-senha.html" class="esqueceu-senha">Esqueceu a senha?</a>

                        <label class="lembrar-dados">
                            <input type="checkbox">
                            <span>Lembrar meus dados</span>
                        </label>

                        <button class="btn-entrar" type="submit">Entrar</button>

                        <div class="cadastrar-link">
                            <span></span>
                            <p>Ainda não tem uma conta?</p>
                            <a href="cadastre-se.html">Cadastre-se</a>
                            <span></span>
                        </div>
                    </form>
                </div>
            </section>

            <aside class="painel" id="painel">
                <img src="../../assets/images/fernando/mulher-crianca.png" alt="mulher com a criança">
            </aside>
    </main>

    <!-- FIM DA MINHA SESSÃO -->

    <script src="https://cdn.userway.org/widget.js" data-account="y2KIm9pPv2"></script>
    <script src="../scripts/login.js"></script>
</body>
</html>
